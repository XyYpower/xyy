services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowbase
      POSTGRES_PASSWORD: knowbase123
      POSTGRES_DB: knowbase
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowbase"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
